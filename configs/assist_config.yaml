detection:
  # Larger, more accurate model (identifies more everyday objects
  # reliably).  ~2x the CPU latency of yolov8n (137ms vs ~60ms/frame).
  # Swap back to yolov8n.onnx for faster but less confident detection.
  model_path: "models/yolov8s.onnx"
  input_size: 640
  conf_threshold: 0.40
  iou_threshold: 0.45
  every_n_frames: 2
  # Optional per-class confidence floors (raise the bar for classes the
  # model over-triggers on).  Empty by default — real objects are never
  # silently dropped.  Set from evidence (threshold sweep), not guesses.
  conf_overrides: {}
  # Heuristic that drops "laptop" boxes taller than wide.  Off by
  # default: it can discard real (open) laptops.
  filter_tall_laptops: false
  # Per-class shape/size rejection (evidence-based).  A book facing the
  # camera is big and squarish (aspect < ~1.8) while a real "remote" is
  # small and wide (aspect > ~2), so book misdetections are dropped
  # without touching real remotes.  Tune with your own camera.
  reject_box_shape:
    remote:
      min_aspect: 1.8       # too square/tall for a remote -> not one
      max_area_ratio: 0.25  # covers >25% of the frame -> not a remote

tracking:
  iou_threshold: 0.3
  max_missed: 8
  # EMA smoothing on the box (0 = raw, 1 = no smoothing, 0.2-0.6 typical).
  smoothing: 0.4
  # EMA smoothing on confidence (0..1).
  conf_smoothing: 0.5
  # Penalise matches across different classes (never steal identities).
  class_consistent: true
  # Rolling window (frames) for temporal label voting.
  label_vote_window: 5
  distance_change_metres: 1.0
  min_announce_interval: 3.0

navigation:
  # Vertical field of view of the camera (degrees).  Big lever on
  # distance accuracy — measure your webcam's real FOV if you can.
  # Typical laptop webcams: ~50-60 deg vertical.
  vertical_fov: 55
  # Optional per-class real-world heights override:
  # reference_heights:
  #   person: 1.7

ocr:
  # OCR runs on its own dedicated worker thread (never on the vision
  # thread), so text can be read aloud without ever blocking the camera.
  # Enabled by default so the system keeps speaking; the async engine
  # keeps it non-blocking either way.
  enabled: true
  min_confidence: 0.3
  max_boxes: 50
  every_n_frames: 10
  # true  = announce text found, press R to hear it
  # false = read text aloud automatically as soon as it's detected
  ask_before_reading: false
  # OCR input preprocessing strategy (none|gray|threshold|contrast|downscale|downscale2)
  preprocess: "none"

  # ---- Object-aware OCR ----
  # Instead of scanning the whole frame, eligible tracked objects
  # (configs/ocr_policy.yaml) have their ROI inspected for text.
  object_ocr_enabled: true
  policy_path: "configs/ocr_policy.yaml"
  # Fraction of the box width/height added on each side before OCR.
  roi_padding: 0.1
  # Minimum accepted ROI size (px); smaller boxes are skipped.
  roi_min_w: 24
  roi_min_h: 12
  # Cap on ROI upscaling (x1, x2 or x3) so small labels get read.
  max_upscale: 3.0
  # Cheap text-presence gate before the (slow) OCR call.
  text_presence: true
  # Preprocessing variants tried per ROI (1..4).
  variants: 3
  # Per-track re-OCR rules.
  cooldown_s: 3.0
  stale_after_s: 5.0
  move_px: 40
  # Read recognised text aloud automatically (false = press R to read).
  auto_read: false
  # Max history entries kept for the side text panel.
  history_max: 20
  # Minimum characters for a result to be considered real text.
  min_chars: 2
  # Mark a request as "timeout" (logged) when a single OCR call exceeds
  # this.  RapidOCR is not interruptible mid-call.
  timeout_ms: 2000
  # Keep the last N raw OCR records (text boxes, confidences, ROI image)
  # for debugging.  Dump with pipe.dump_ocr_debug(dir); 0 disables.
  debug_records: 8

depth:
  # Optional monocular depth stage (default off — keeps CPU budget).
  # "synthetic" needs no model; "depth_anything_v2" needs model_path.
  enabled: false
  backend: "synthetic"
  model_path: ""

speech:
  rate: 165
  volume: 1.0
  # Speech priority queue: minimum seconds between phrases and the
  # dedup window before an identical phrase may repeat.
  min_interval: 1.2
  dedupe_window: 4.0

decision:
  cooldown_seconds: 4.0
  min_priority: 5
  speak_ocr_text: true
  max_ocr_chars: 80

planner:
  # Response planner (priority/dedup/cooldown) over spoken responses.
  cooldown_seconds: 2.5
  # Skip responses with priority equal to or worse than this
  # (5 = QUIET; urgent safety = 0 always wins and bypasses cooldown).
  min_priority: 5
  dedupe: true

camera:
  id: 0
  resolution: [1280, 720]
  # The vision pipeline (YOLO/OCR) ALWAYS receives geometrically correct
  # frames.  `mirror` and `rotate` are applied once at capture:
  #   mirror: true would feed OCR mirrored text — keep false.
  #   rotate: physical sensor orientation (0/90/180/270) for a camera
  #           mounted sideways in portrait; 0 unless yours is rotated.
  mirror: false
  rotate: 0
  # Front-camera selfie-style preview: mirror only the displayed video
  # (the OCR card / HUD / text overlays are drawn on top and stay
  # readable).  Set false for a true-orientation preview.
  preview_mirror: true

app:
  display_scale: 1.0
  jpeg_width: 960
  jpeg_quality: 70
