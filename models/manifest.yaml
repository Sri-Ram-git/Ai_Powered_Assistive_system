# Model manifest — declares every model the device can use.
#
# Tracks provenance, license, size, and the runtime that consumes each
# model so the project stays audit-friendly and reproducible.
#
# Weights are NOT stored in the repo (git-ignored under models/*.onnx).
# This manifest is the record of what SHOULD be present at runtime and
# where it comes from.
models:
  - id: yolov8n
    name: YOLOv8 nano
    task: object_detection
    file: models/yolov8n.onnx
    runtime: opencv_dnn          # cv2.dnn.readNetFromONNX
    source: https://github.com/ultralytics/assets/releases
    license: AGPL-3.0            # Ultralytics default; verify for distribution
    input_size: 640              # fixed-shape export; 416/320 fail
    classes: 80                  # COCO
    sha256: null                 # populate after download: certutil -hashfile models/yolov8n.onnx SHA256
    downloaded: false

  - id: rapidocr
    name: RapidOCR (PP-OCR)
    task: text_recognition
    file: null                   # provided by the rapidocr-onnxruntime wheel
    runtime: onnxruntime_cpu
    source: https://github.com/RapidAI/RapidOCR
    license: Apache-2.0
    input_size: null
    classes: null
    sha256: null
    downloaded: true             # bundled with the pip package

  - id: depth_anything_v2 (optional)
    name: Depth Anything V2
    task: monocular_depth
    file: models/depth_anything_v2.onnx   # optional; only if enabled
    runtime: onnxruntime_cpu
    source: https://github.com/DepthAnything/Depth-Anything-V2
    license: Apache-2.0
    input_size: 518
    classes: null
    sha256: null
    downloaded: false

  - id: faster_whisper (optional)
    name: Faster-Whisper small
    task: speech_recognition
    file: null                   # downloaded by faster-whisper at first use
    runtime: ctranslate2
    source: https://github.com/SYSTRAN/faster-whisper
    license: MIT
    input_size: null
    classes: null
    sha256: null
    downloaded: false