name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      # Tests must run headless: the CI runner has no camera/display.
      # A missing model file must not fail the suite (it is git-ignored).
      - name: Run test suite with coverage
        env:
          OPENCV_VIDEOIO_PRIORITY_MSMF: 0
          ASSIST_HEADLESS: "1"
        run: |
          python -m pytest -q

      - name: Security & privacy self-check
        run: python scripts/audit/security_scan.py

      - name: Verify pipeline imports headless (no hardware)
        run: python -c "from src.core.pipeline import AsyncVisionPipeline; from src.server.app import create_app; from src.api import create_api; from src.ui import create_ui; print('imports OK')"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: ruff check src tests scripts performance