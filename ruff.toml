# Ruff configuration — conservative, stable rule set.
#
# Ruff's default rule set grew across versions, which made CI lint results
# depend on whatever `pip install ruff` happened to resolve.  Pin a fixed,
# narrow selection (pyflakes F + selected pycodestyle E) so `ruff check`
# is deterministic on every runner and version.
[lint]
select = ["E4", "E7", "E9", "F"]